name: Preview Release

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Full commit SHA to release
        required: true
        type: string
      release_version:
        description: Unprefixed beta SemVer
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ inputs.release_ref }}

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_REF: ${{ inputs.release_ref }}
      RELEASE_VERSION: ${{ inputs.release_version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Verify release identity and mutation preconditions
        run: |
          set -euo pipefail
          [[ $(git rev-parse HEAD) == "$RELEASE_REF" ]]
          [[ $RELEASE_REF =~ ^[0-9a-f]{40}$ ]]
          [[ $GITHUB_SHA == "$RELEASE_REF" ]]
          [[ $RELEASE_VERSION =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta\.(0|[1-9][0-9]*)$ ]]

          git fetch origin main --tags
          git merge-base --is-ancestor "$RELEASE_REF" origin/main

          manifest_version=$(python3 - extension.toml <<'PY'
          import sys
          import tomllib

          with open(sys.argv[1], "rb") as manifest_file:
              print(tomllib.load(manifest_file)["extension"]["version"])
          PY
          )
          [[ $manifest_version == "$RELEASE_VERSION" ]]

          notes_file="docs/releases/${RELEASE_VERSION}.md"
          [[ -f $notes_file && ! -L $notes_file ]]
          grep -qF -- 'exact trusted post-tag builds' "$notes_file"
          grep -qF -- \
            'official releases from v0.3.0-beta.14 onward' \
            "$notes_file"
          [[ ! -e .compozy && ! -L .compozy ]]

      - name: Check remote release preconditions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          owner=${GITHUB_REPOSITORY%%/*}
          name=${GITHUB_REPOSITORY#*/}
          [[ -n $owner && -n $name && $owner != "$name" ]]
          preflight_json=$(gh api graphql \
            -f query='query($owner: String!, $name: String!, $tagRef: String!, $tagName: String!) {
              repository(owner: $owner, name: $name) {
                ref(qualifiedName: $tagRef) { target { oid } }
                release(tagName: $tagName) { isDraft tagName }
              }
            }' \
            -f owner="$owner" \
            -f name="$name" \
            -f tagRef="refs/tags/$tag" \
            -f tagName="$tag")
          jq -e '
            (.errors == null) and
            (.data.repository != null) and
            (.data.repository.ref == null) and
            (.data.repository.release == null)
          ' <<<"$preflight_json" >/dev/null

      - name: Build and validate release assets
        run: |
          set -euo pipefail
          asset_dir="${RUNNER_TEMP}/release-assets"
          mkdir "$asset_dir"
          [[ -d $asset_dir && ! -L $asset_dir ]]
          [[ -z $(find "$asset_dir" -mindepth 1 -print -quit) ]]
          ./scripts/build-preview-assets.sh "$RELEASE_VERSION" "$asset_dir"
          (cd "$asset_dir" && sha256sum --check SHA256SUMS)

          expected_assets=$(printf '%s\n' 'SHA256SUMS' "batuta-compozy_${RELEASE_VERSION}.tar.gz")
          actual_assets=$(find "$asset_dir" -mindepth 1 -maxdepth 1 -type f \
            -printf '%f\n' | sort)
          [[ $actual_assets == "$expected_assets" ]]

      - name: Attest preview archive
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4
        with:
          subject-path: ${{ runner.temp }}/release-assets/batuta-compozy_${{ inputs.release_version }}.tar.gz

      - name: Attest preview checksums
        uses: actions/attest-build-provenance@8beda2b7ed98355c0e97c0a63bec38ae472e66c4
        with:
          subject-path: ${{ runner.temp }}/release-assets/SHA256SUMS

      - name: Create and push annotated release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git tag -a "v${RELEASE_VERSION}" -m "Release v${RELEASE_VERSION}" "$RELEASE_REF"
          [[ $(git cat-file -t "$tag") == tag ]]
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git push origin "refs/tags/${tag}:refs/tags/${tag}"
          unset auth

      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          asset_dir="${RUNNER_TEMP}/release-assets"
          notes_file="docs/releases/${RELEASE_VERSION}.md"
          gh release create "$tag" \
            "$asset_dir/batuta-compozy_${RELEASE_VERSION}.tar.gz" \
            "$asset_dir/SHA256SUMS" \
            --verify-tag \
            --draft \
            --prerelease \
            --latest=false \
            --title "Batuta ${RELEASE_VERSION}" \
            --notes-file "$notes_file"

      - name: Download and verify draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          download_dir="${RUNNER_TEMP}/release-download"
          mkdir "$download_dir"
          [[ -d $download_dir && ! -L $download_dir ]]
          [[ -z $(find "$download_dir" -mindepth 1 -print -quit) ]]
          gh release download "$tag" --dir "$download_dir"

          expected_assets=$(printf '%s\n' 'SHA256SUMS' "batuta-compozy_${RELEASE_VERSION}.tar.gz")
          actual_assets=$(find "$download_dir" -mindepth 1 -maxdepth 1 -type f \
            -printf '%f\n' | sort)
          [[ $actual_assets == "$expected_assets" ]]
          (cd "$download_dir" && sha256sum --check SHA256SUMS)

      - name: Publish verified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          gh release edit "$tag" --draft=false --prerelease --latest=false

      - name: Verify published release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${RELEASE_VERSION}"
          archive="batuta-compozy_${RELEASE_VERSION}.tar.gz"
          release_json=$(gh release view "$tag" --json isDraft,isPrerelease,tagName,assets)
          jq -e --arg tag "$tag" --arg archive "$archive" '
            (.isDraft == false) and
            (.isPrerelease == true) and
            (.tagName == $tag) and
            ([.assets[].name] | sort) == (["SHA256SUMS", $archive] | sort)
          ' <<<"$release_json" >/dev/null

          owner=${GITHUB_REPOSITORY%%/*}
          name=${GITHUB_REPOSITORY#*/}
          published_json=$(gh api graphql \
            -f query='query($owner: String!, $name: String!, $tagRef: String!, $tagName: String!) {
              repository(owner: $owner, name: $name) {
                ref(qualifiedName: $tagRef) {
                  target {
                    __typename
                    ... on Tag {
                      target {
                        __typename
                        ... on Commit { oid }
                      }
                    }
                  }
                }
                release(tagName: $tagName) { isLatest tagName }
              }
            }' \
            -f owner="$owner" \
            -f name="$name" \
            -f tagRef="refs/tags/$tag" \
            -f tagName="$tag")
          jq -e --arg tag "$tag" --arg release_ref "$RELEASE_REF" '
            (.errors == null) and
            (.data.repository != null) and
            (.data.repository.ref != null) and
            (.data.repository.ref.target != null) and
            (.data.repository.ref.target.__typename == "Tag") and
            (.data.repository.ref.target.target != null) and
            (.data.repository.ref.target.target.__typename == "Commit") and
            (.data.repository.ref.target.target.oid == $release_ref) and
            (.data.repository.release != null) and
            (.data.repository.release.isLatest == false) and
            (.data.repository.release.tagName == $tag)
          ' <<<"$published_json" >/dev/null
