apiVersion: compozy.loop/v1
kind: Loop
meta:
  name: batuta-deliver
  description: Batuta implements, reviews, publishes, and verifies every approved task without a routine human gate.
  catalog:
    use_when: "You have approved tasks and an applied Batuta routing generation ready for autonomous delivery."
    keywords: [batuta, deliver, route, implement, review, publish]
    category: Engineering

concurrency: queue

inputs:
  delivery_id:
    type: string
    required: true
  attempt:
    type: number
    required: true
  slug:
    type: string
    required: true
  origin_session_id:
    type: string
    required: true
  worktree_ref:
    type: string
    required: true
  routing_generation:
    type: string
    required: true
  absolute_deadline:
    type: string
    required: true
  token_ceiling:
    type: number
    required: true
  recovery_operation_id:
    type: string
    required: true

contract:
  goal: >
    Deliver .compozy/tasks/{{ .inputs.slug }} end to end in the isolated
    worktree using routing generation {{ .inputs.routing_generation }}:
    implement each task with one commit, review and remediate until clean,
    publish the exact reviewed HEAD, open the pull request, and verify it.
  definition_of_done: >
    The implementation child ended done, review ended done or no-op, and
    publication_verify independently confirmed the exact remote HEAD and PR
    URL, or a genuine nothing-to-publish result. Merge remains manual.
  iteration_cap: 4
  budget:
    tokens: 0
    wall_clock_sec: 14400
    on_exceeded: halt
  terminal_states: [done, no-op, blocked, failed, canceled, exhausted, stalled]
  on_done:
    - &return_to_origin
      tool: compozy__session_prompt
      with:
        session_id: "{{ .inputs.origin_session_id }}"
        message_id: "batuta-terminal-{{ .inputs.delivery_id }}-{{ .effect.identity.loop_run_id }}-g{{ .effect.identity.generation }}-{{ .effect.identity.trigger }}"
        idempotency_key: "batuta-terminal-{{ .inputs.delivery_id }}-{{ .effect.identity.loop_run_id }}-g{{ .effect.identity.generation }}-{{ .effect.identity.trigger }}"
        mode: queue
        message: |
          Batuta delivery_id {{ .inputs.delivery_id }} parent run
          {{ .effect.identity.loop_run_id }} reached trigger
          {{ .effect.identity.trigger }} in generation
          {{ .effect.identity.generation }}. Read this exact parent once with
          compozy__loop_status, then call ext__batuta__routing_apply operation
          reconcile_fallbacks with both delivery_id and delivery_run_id set to
          {{ .inputs.delivery_id }} and {{ .effect.identity.loop_run_id }}.
          If recoverable, call recover_delivery exactly once with those same two
          identities and end the turn. Otherwise report the authoritative
          terminal result, commits, reviewed HEAD, publication operation IDs,
          verified PR URL, blocker, and that merge remains manual.
  on_noop:
    - *return_to_origin
  on_blocked:
    - *return_to_origin
  on_failed:
    - *return_to_origin
  on_exhausted:
    - *return_to_origin
  on_stalled:
    - *return_to_origin
  on_canceled:
    - *return_to_origin

start:
  - kind: manual
  - kind: cli
  - kind: http
  - kind: uds
  - kind: native_tool
  - kind: schedule

graph:
  nodes:
    - id: slug_input
      class: source
      kind: input
      input_ref: slug

    - id: load_check
      class: action
      kind: ext__spec_cycle__import_tasks
      params:
        pattern: ".compozy/tasks/{{ .inputs.slug }}/task_*.md"
      produces:
        tasks: array
        count: integer

    - id: routing_context
      class: action
      kind: ext__batuta__routing_context
      params:
        delivery_id: "{{ .inputs.delivery_id }}"
        attempt: "{{ .inputs.attempt }}"
        slug: "{{ .inputs.slug }}"
        routing_generation: "{{ .inputs.routing_generation }}"

    - id: implement
      class: action
      kind: run-loop
      params:
        loop: implement-tasks
        config_overrides:
          iteration_cap: 4
          budget_tokens: "{{ .nodes.routing_context.output.remaining_tokens }}"
          budget_wall_sec: "{{ .nodes.routing_context.output.remaining_wall_seconds }}"
          budget_on_exceeded: halt
          reattempt_strategy: halt
          runtime_rules: "{{ .nodes.routing_context.output.runtime_rules }}"
          environment:
            mode: worktree
            worktree_ref: "{{ .inputs.worktree_ref }}"
        inputs:
          slug: "{{ .inputs.slug }}"
          auto_commit: true

    - id: delivery_budget_context
      class: action
      kind: ext__batuta__delivery_budget_context
      params:
        delivery_id: "{{ .inputs.delivery_id }}"
        attempt: "{{ .inputs.attempt }}"

    - id: review
      class: action
      kind: run-loop
      params:
        loop: review-and-fix
        config_overrides:
          iteration_cap: 4
          budget_tokens: "{{ .nodes.delivery_budget_context.output.remaining_tokens }}"
          budget_wall_sec: "{{ .nodes.delivery_budget_context.output.remaining_wall_seconds }}"
          budget_on_exceeded: halt
          reattempt_strategy: halt
          environment:
            mode: worktree
            worktree_ref: "{{ .inputs.worktree_ref }}"
        inputs:
          task_name: "{{ .inputs.slug }}"
          auto_commit: true

    - id: publication_plan
      class: action
      kind: ext__batuta__publication_plan
      params:
        worktree_ref: "{{ .inputs.worktree_ref }}"

    - id: publication_route
      class: control
      kind: route
      routes:
        - when: nodes.publication_plan.output.disposition == 'publishable'
          to: publish
        - when: nodes.publication_plan.output.disposition == 'nothing_to_publish'
          to: publication_verify_nothing
        - when: nodes.publication_plan.output.disposition == 'blocked'
          to: publication_blocked_stop
      default: publication_contract_failure

    - id: publish
      class: action
      kind: ext__batuta__publish_worktree
      params:
        worktree_ref: "{{ .inputs.worktree_ref }}"
        expected_head_sha: "{{ .nodes.publication_plan.output.head_sha }}"

    - id: publication_verify
      class: action
      kind: ext__batuta__publication_verify
      params:
        worktree_ref: "{{ .inputs.worktree_ref }}"
        expected_head_sha: "{{ .nodes.publication_plan.output.head_sha }}"
        publisher_result: "{{ .nodes.publish.output }}"

    - id: publication_verify_nothing
      class: action
      kind: ext__batuta__publication_verify
      params:
        worktree_ref: "{{ .inputs.worktree_ref }}"
        expected_head_sha: "{{ .nodes.publication_plan.output.head_sha }}"
        publisher_result:
          status: nothing_to_publish
          head_sha: "{{ .nodes.publication_plan.output.head_sha }}"
          op_ids: []
          summary: "fresh publication plan found no commits to publish"
          last_exit_plan: "{{ .nodes.publication_plan.output.exit_plan }}"

    - id: publication_blocked_stop
      class: action
      kind: ext__batuta__publication_verify
      params: &blocked_stop
        worktree_ref: "{{ .inputs.worktree_ref }}"
        expected_head_sha: "{{ .nodes.publication_plan.output.head_sha }}"
        publisher_result:
          status: blocked
          head_sha: "{{ .nodes.publication_plan.output.head_sha }}"
          op_ids: []
          summary: "publication planning found a deterministic external blocker"
          last_exit_plan: "{{ .nodes.publication_plan.output.exit_plan }}"

    - id: publication_contract_failure
      class: action
      kind: ext__batuta__publication_verify
      params: *blocked_stop

  edges:
    - from: slug_input
      to: load_check
    - from: load_check
      to: routing_context
    - from: routing_context
      to: implement
    - from: implement
      to: delivery_budget_context
    - from: delivery_budget_context
      to: review
    - from: review
      to: publication_plan
    - from: publication_plan
      to: publication_route
    - from: publication_route
      to: publish
    - from: publication_route
      to: publication_verify_nothing
    - from: publication_route
      to: publication_blocked_stop
    - from: publication_route
      to: publication_contract_failure
    - from: publish
      to: publication_verify
