apiVersion: compozy.loop/v1
kind: Loop
meta:
  name: batuta-deliver
  description: Batuta's full delivery cycle - implement every task for a slug, then review and fix until a round comes back clean.
  catalog:
    use_when: "You have authored tasks under .compozy/tasks/<slug> and want the full batuta cycle: implementation with atomic commits, then review rounds until clean."
    keywords: [batuta, deliver, implement, review]
    category: Engineering

concurrency: queue

inputs:
  slug:
    type: string
    required: true
  origin_session_id:
    type: string
    required: true
  auto_commit:
    type: boolean
    default: true
  worktree_ref:
    type: string
    required: true

environment:
  mode: worktree
  worktree_ref: "{{ .inputs.worktree_ref }}"

contract:
  goal: >
    Deliver the feature for .compozy/tasks/{{ .inputs.slug }} end to end: implement every
    authored task in dependency order, then review and remediate until a review round is clean.
  definition_of_done: >
    The implement-tasks child run ended done and the review-and-fix child run ended done or no-op.
  iteration_cap: 1
  budget:
    tokens: 0
    wall_clock_sec: 0
    on_exceeded: halt
  terminal_states: [done, no-op, blocked, failed, canceled, exhausted, stalled]
  on_done:
    - &return_to_origin
      tool: compozy__session_prompt
      with:
        session_id: "{{ .inputs.origin_session_id }}"
        message_id: "batuta-terminal-{{ .effect.identity.loop_run_id }}"
        idempotency_key: "batuta-terminal-{{ .effect.identity.loop_run_id }}"
        mode: queue
        message: |
          Batuta delivery run {{ .effect.identity.loop_run_id }} reached terminal
          trigger {{ .effect.identity.trigger }}. Inspect the run with
          `compozy__loop_status`, then report its exact terminal outcome, child run
          IDs, commits, and blocker in this conversation. Decide any redispatch or
          escalation with the operator. Never approve a gate, edit code, push, or
          mutate routing from this return prompt.
  on_noop:
    - *return_to_origin
  on_blocked:
    - *return_to_origin
  on_failed:
    - *return_to_origin
  on_exhausted:
    - *return_to_origin
  on_stalled:
    - *return_to_origin
  on_canceled:
    - *return_to_origin

start:
  - kind: manual
  - kind: cli
  - kind: http
  - kind: uds
  - kind: native_tool
  - kind: schedule

graph:
  nodes:
    - id: slug_input
      class: source
      kind: input
      input_ref: slug

# The agent's direct import preflight detects a missing task set before dry-run.
# This graph remains fail-closed for direct submissions that skip that preflight.
    - id: load_check
      class: action
      kind: ext__spec_cycle__import_tasks
      params:
        pattern: ".compozy/tasks/{{ .inputs.slug }}/task_*.md"
      produces:
        tasks: array
        count: integer

    - id: implement
      class: action
      kind: run-loop
      params:
        loop: implement-tasks
        inputs:
          slug: "{{ .inputs.slug }}"
          auto_commit: "{{ .inputs.auto_commit }}"

    - id: review
      class: action
      kind: run-loop
      params:
        loop: review-and-fix
        inputs:
          task_name: "{{ .inputs.slug }}"
          auto_commit: "{{ .inputs.auto_commit }}"

    - id: worktree_state
      class: action
      kind: compozy__worktree_inspect
      params:
        ref: "{{ .inputs.worktree_ref }}"
      produces:
        status:
          type: object
          properties:
            ahead_of_base:
              type: integer

    - id: publish_check
      class: control
      kind: branch
      condition: "nodes.worktree_state.output.status.ahead_of_base > 0"

    - id: publish_gate
      class: control
      kind: gate
      criteria:
        - kind: human
      effects:
        on_pause:
          - tool: compozy__session_prompt
            with:
              session_id: "{{ .inputs.origin_session_id }}"
              message_id: "batuta-gate-{{ .effect.identity.loop_run_id }}-publish"
              idempotency_key: "batuta-gate-{{ .effect.identity.loop_run_id }}-publish"
              mode: queue
              message: |
                Batuta delivery run {{ .effect.identity.loop_run_id }} is parked
                needs-approval on the publication gate. Read compozy__loop_status,
                report run ID and gate ID with the review evidence, and wait for
                the operator's decision. Never approve this gate yourself; never
                edit code, push, or poll.

    - id: publish
      class: action
      kind: goal
      params:
        agent: batuta-publisher
        environment:
          mode: worktree
          worktree_ref: "{{ .inputs.worktree_ref }}"
        judge:
          - id: worktree_clean
            type: command
            check: "git status --porcelain | grep -q . && exit 1 || exit 0"
        max_turns: 6
        output_schema:
          type: object
          required: [status, summary]
          properties:
            status:
              enum: [completed, blocked]
            summary:
              type: string
            head_sha:
              type: string
            pr_url:
              type: string
        objective: |
          Publish the reviewed delivery branch of worktree
          {{ .inputs.worktree_ref }}. Follow your agent contract exactly:
          verify clean HEAD, read the exit plan, push, open the PR against the
          repository default branch with title and body derived from
          .compozy/tasks/{{ .inputs.slug }} artifacts, and report the PR URL —
          or the exit plan's compare URL with "pushed, PR manual" when no forge
          provider serves.

  edges:
    - from: slug_input
      to: load_check
    - from: load_check
      to: implement
    - from: implement
      to: review
    - from: review
      to: worktree_state
    - from: worktree_state
      to: publish_check
    - from: publish_check
      to: publish_gate
    - from: publish_gate
      to: publish
