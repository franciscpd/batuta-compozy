apiVersion: compozy.loop/v1
kind: Loop
meta:
  name: batuta-deliver
  description: Batuta's full delivery cycle in a worktree - implement every task for a slug in the delivery worktree, then review and fix until clean, then publish behind a human gate.
  catalog:
    use_when: "You have authored tasks under .compozy/tasks/<slug> and want the full batuta cycle in an isolated worktree: implementation with atomic commits, review rounds until clean, and gated publication to the base branch."
    keywords: [batuta, deliver, implement, review]
    category: Engineering

concurrency: queue

inputs:
  slug:
    type: string
    required: true
  origin_session_id:
    type: string
    required: true
  auto_commit:
    type: boolean
    default: true
  worktree_ref:
    type: string
    required: true

environment:
  mode: worktree
  worktree_ref: "{{ .inputs.worktree_ref }}"

contract:
  goal: >
    Deliver the feature for .compozy/tasks/{{ .inputs.slug }} end to end in the
    delivery worktree: implement every authored task in dependency order,
    review and remediate until a round is clean, then — behind the human
    publication gate — publish the delivery branch.
  definition_of_done: >
    The implement-tasks child ended done, the review-and-fix child ended done
    or no-op, the human publication gate was approved, and the publish node
    ended done reporting the delivery HEAD SHA, its operation IDs, and either
    a PR URL or an explicit push-only compare URL. A branch with nothing to
    publish still reaches the gate: the publisher establishes that from the
    exit plan after approval and reports it as its publication evidence.
  iteration_cap: 1
  # wall_clock_sec here is declared intent (the daemon rejects a template in
  # this field, so it is a fixed literal, not a mechanism). It is reported in
  # the daemon's materialized_contract but the daemon does NOT derive
  # effective_config.budget_wall_sec from it: a workspace with no stored
  # budget_wall_sec override runs this Loop unbounded (effective_config.
  # budget_wall_sec: 0) even though this literal says 14400. The real
  # backstop is a workspace-scope compozy__loop_configure override
  # (budget_wall_sec: 14400, budget_on_exceeded: halt) that agents/batuta/
  # AGENT.md's Bootstrap section provisions and Dispatch verifies before
  # every real run; see that file's Escalation section for the full
  # precedence (per-run config_overrides > stored compozy__loop_configure >
  # this literal's daemon default of 0).
  budget:
    tokens: 0
    wall_clock_sec: 14400
    on_exceeded: halt
  terminal_states: [done, no-op, blocked, failed, canceled, exhausted, stalled]
  on_done:
    - &return_to_origin
      tool: compozy__session_prompt
      with:
        session_id: "{{ .inputs.origin_session_id }}"
        message_id: "batuta-terminal-{{ .effect.identity.loop_run_id }}"
        idempotency_key: "batuta-terminal-{{ .effect.identity.loop_run_id }}"
        mode: queue
        message: |
          Batuta delivery run {{ .effect.identity.loop_run_id }} reached terminal
          trigger {{ .effect.identity.trigger }}. Inspect the run with
          `compozy__loop_status`, then report its exact terminal outcome, child run
          IDs, commits, blocker, and publication evidence (HEAD SHA, PR or
          compare URL) when the publish node ran, in this conversation. Decide any
          redispatch or escalation with the operator. Never approve a gate, edit
          code, push, publish, or mutate routing from this return prompt.
  on_noop:
    - *return_to_origin
  on_blocked:
    - *return_to_origin
  on_failed:
    - *return_to_origin
  on_exhausted:
    - *return_to_origin
  on_stalled:
    - *return_to_origin
  on_canceled:
    - *return_to_origin

start:
  - kind: manual
  - kind: cli
  - kind: http
  - kind: uds
  - kind: native_tool
  - kind: schedule

graph:
  nodes:
    - id: slug_input
      class: source
      kind: input
      input_ref: slug

# The agent's direct import preflight detects a missing task set before dry-run.
# This graph remains fail-closed for direct submissions that skip that preflight.
    - id: load_check
      class: action
      kind: ext__spec_cycle__import_tasks
      params:
        pattern: ".compozy/tasks/{{ .inputs.slug }}/task_*.md"
      produces:
        tasks: array
        count: integer

    - id: implement
      class: action
      kind: run-loop
      params:
        loop: implement-tasks
        inputs:
          slug: "{{ .inputs.slug }}"
          auto_commit: "{{ .inputs.auto_commit }}"

    - id: review
      class: action
      kind: run-loop
      params:
        loop: review-and-fix
        inputs:
          task_name: "{{ .inputs.slug }}"
          auto_commit: "{{ .inputs.auto_commit }}"

    # compozy__worktree_inspect's input_schema (confirmed via
    # `compozy tool info compozy__worktree_inspect`) exposes only `ref` and
    # `workspace` — there is no `refresh` flag or equivalent freshness knob on
    # this native tool, so this node cannot force a fresh read; its
    # output.status is documented by the daemon as "cached status" and can
    # legitimately be stale (proven: it needs an explicit refresh — e.g. the
    # CLI-only `compozy worktree status --refresh` — that this node surface
    # does not expose).
    - id: worktree_state
      class: action
      kind: compozy__worktree_inspect
      params:
        ref: "{{ .inputs.worktree_ref }}"
      produces:
        status:
          type: object
          properties:
            ahead_of_base:
              type: integer

    # Fail-closed by design: publish_check must never let a stale
    # ahead_of_base reading route silently past the human gate. The only
    # freshness signal worktree_state.output.status exposes is a
    # `refreshed_at` timestamp, but this daemon's branch-condition CEL has no
    # `now()` (confirmed: `compozy loop validate` rejects it as an
    # "undeclared reference to 'now'"), so there is no expression in this
    # grammar that can prove a given ahead_of_base reading is fresh rather
    # than cached-stale. Per the mandated fallback for that case, this
    # condition is unconditionally true: publish_check always routes to
    # publish_gate, and the human at the gate — not this predicate — is the
    # one who gets to decide "nothing to publish" is really true. A zero,
    # null, missing, or stale ahead_of_base can therefore never short-circuit
    # straight to a silent `done`; the cheap, safe outcome (an operator
    # looking at an empty branch) replaces the worst failure mode (a
    # publishable commit that never reaches anyone).
    - id: publish_check
      class: control
      kind: branch
      condition: "true"

    - id: publish_gate
      class: control
      kind: gate
      criteria:
        - kind: human
      effects:
        on_pause:
          - tool: compozy__session_prompt
            with:
              session_id: "{{ .inputs.origin_session_id }}"
              message_id: "batuta-gate-{{ .effect.identity.loop_run_id }}-publish"
              idempotency_key: "batuta-gate-{{ .effect.identity.loop_run_id }}-publish"
              mode: queue
              message: |
                Batuta delivery run {{ .effect.identity.loop_run_id }} is parked
                needs-approval on the publication gate. Read compozy__loop_status,
                report run ID and gate ID with the review evidence, and wait for
                the operator's decision. Never approve this gate yourself; never
                edit code, push, or poll.

    - id: publish
      class: action
      kind: goal
      params:
        agent: batuta-publisher
        environment:
          mode: worktree
          worktree_ref: "{{ .inputs.worktree_ref }}"
        judge:
          - id: worktree_clean
            type: command
            check: "test -z \"$(git -C . status --porcelain)\""
        max_turns: 10
        # head_sha and op_ids are required so a "success" report can never be
        # evidence-free; anyOf(pr_url, compare_url) requires at least one
        # publication URL, matching the definition_of_done's "PR URL or an
        # explicit push-only compare URL" — compare_url is the field the
        # push-only path (no forge provider) reports. `compozy loop validate`
        # accepts anyOf at the output_schema root for a goal node.
        output_schema:
          type: object
          required: [status, summary, head_sha, op_ids]
          properties:
            status:
              enum: [completed, blocked]
            summary:
              type: string
            head_sha:
              type: string
            op_ids:
              type: array
              items:
                type: string
            pr_url:
              type: string
            compare_url:
              type: string
          anyOf:
            - required: [pr_url]
            - required: [compare_url]
        objective: |
          Publish the reviewed delivery branch of worktree
          {{ .inputs.worktree_ref }}. Follow your agent contract exactly:
          verify clean HEAD, read the exit plan, push, open the PR against the
          repository default branch with title and body derived from
          .compozy/tasks/{{ .inputs.slug }} artifacts, and report the PR URL —
          or the exit plan's compare URL with "pushed, PR manual" when no forge
          provider serves.

  edges:
    - from: slug_input
      to: load_check
    - from: load_check
      to: implement
    - from: implement
      to: review
    - from: review
      to: worktree_state
    - from: worktree_state
      to: publish_check
    - from: publish_check
      to: publish_gate
    - from: publish_gate
      to: publish
