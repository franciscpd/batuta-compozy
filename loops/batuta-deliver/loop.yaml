apiVersion: compozy.loop/v1
kind: Loop
meta:
  name: batuta-deliver
  description: Batuta's full delivery cycle - implement every task for a slug, then review and fix until a round comes back clean.
  catalog:
    use_when: "You have authored tasks under .compozy/tasks/<slug> and want the full batuta cycle: implementation with atomic commits, then review rounds until clean."
    keywords: [batuta, deliver, implement, review]
    category: Engineering

concurrency: queue

inputs:
  slug:
    type: string
    required: true
  auto_commit:
    type: boolean
    default: true

contract:
  goal: >
    Deliver the feature for .compozy/tasks/{{ .inputs.slug }} end to end: implement every
    authored task in dependency order, then review and remediate until a review round is clean.
  definition_of_done: >
    The implement-tasks child run ended done and the review-and-fix child run ended done or no-op.
  iteration_cap: 1
  budget:
    tokens: 0
    wall_clock_sec: 0
    on_exceeded: halt
  terminal_states: [done, no-op, blocked, failed, exhausted, stalled]

start:
  - kind: manual
  - kind: cli
  - kind: http
  - kind: uds
  - kind: native_tool
  - kind: schedule

graph:
  nodes:
    - id: slug_input
      class: source
      kind: input
      input_ref: slug

# Guard: a slug with no pending task files must never reach the children.
# Lesson from 2026-08-12: without this, review-and-fix runs a full (expensive)
# reviewer pass even for a nonexistent slug.
# import_tasks HARD-ERRORS on zero matches (taskSetNotFoundError, by design) —
# it never returns an empty list. Without on_error.route the coordinator
# reattempts the failure forever (observed live: gens 1-3, quarantine).
# The error route absorbs the failure into a cheap no-op exit; the success
# path is skipped on error and the route node is skipped on success.
    - id: load_check
      class: action
      kind: ext__dev_cycle__import_tasks
      on_error:
        route: no_tasks
      params:
        pattern: ".compozy/tasks/{{ .inputs.slug }}/task_*.md"
      produces:
        tasks: array
        count: integer

    - id: no_tasks
      class: action
      kind: transform
      params:
        map:
          # transform values are NOT template-interpolated (verified live) — keep
          # the message static; the slug is already recorded in slug_input's output.
          note:
            value: "No task set matched the slug under .compozy/tasks — nothing to deliver; authored tasks are required before dispatch."

    - id: has_tasks
      class: control
      kind: branch
      condition: "size(nodes.load_check.output.tasks) > 0"

    - id: implement
      class: action
      kind: run-loop
      params:
        loop: implement-tasks
        inputs:
          slug: "{{ .inputs.slug }}"
          auto_commit: "{{ .inputs.auto_commit }}"

    - id: review
      class: action
      kind: run-loop
      params:
        loop: review-and-fix
        inputs:
          task_name: "{{ .inputs.slug }}"
          auto_commit: "{{ .inputs.auto_commit }}"

  edges:
    - from: slug_input
      to: load_check
    - from: load_check
      to: no_tasks
    - from: load_check
      to: has_tasks
    - from: has_tasks
      to: implement
    - from: implement
      to: review
