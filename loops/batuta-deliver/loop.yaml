apiVersion: compozy.loop/v1
kind: Loop
meta:
  name: batuta-deliver
  description: Batuta implements and reviews every authored task, then automatically publishes the clean delivery branch and opens a verified pull request.
  catalog:
    use_when: "You have approved tasks under .compozy/tasks/<slug> and want Batuta to implement, review, commit, publish, and open the pull request from an isolated worktree."
    keywords: [batuta, deliver, implement, review, publish]
    category: Engineering

concurrency: queue

inputs:
  slug:
    type: string
    required: true
  origin_session_id:
    type: string
    required: true
  worktree_ref:
    type: string
    required: true

environment:
  mode: worktree
  worktree_ref: "{{ .inputs.worktree_ref }}"

contract:
  goal: >
    Deliver .compozy/tasks/{{ .inputs.slug }} end to end in the delivery
    worktree: implement every authored task with literal commits, review and
    remediate until clean, then automatically publish the exact reviewed HEAD
    and open its pull request.
  definition_of_done: >
    The implement-tasks child ended done, the review-and-fix child ended done
    or no-op, and publication_verify independently confirmed either a real PR
    URL at the exact reviewed remote HEAD or a genuine nothing-to-publish
    result with zero mutations. Publication and PR opening are automatic;
    merge manual. An operator appears only when a deterministic blocker is
    found before any publication mutation.
  iteration_cap: 1
  # The authored 4h intent is not the daemon's effective enforcement by
  # itself. Batuta provisions and verifies the workspace override through
  # compozy__loop_configure; every dispatch requires a nonzero
  # effective_config.budget_wall_sec before submission.
  budget:
    tokens: 0
    wall_clock_sec: 14400
    on_exceeded: halt
  terminal_states: [done, no-op, blocked, failed, canceled, exhausted, stalled]
  on_done:
    - &return_to_origin
      tool: compozy__session_prompt
      with:
        session_id: "{{ .inputs.origin_session_id }}"
        message_id: "batuta-terminal-{{ .effect.identity.loop_run_id }}"
        idempotency_key: "batuta-terminal-{{ .effect.identity.loop_run_id }}"
        mode: queue
        message: |
          Batuta delivery run {{ .effect.identity.loop_run_id }} reached terminal
          trigger {{ .effect.identity.trigger }}. Read compozy__loop_status once
          and report the exact parent/child outcomes, commits, blocker, expected
          HEAD, durable publication operation IDs, verified PR URL, and whether
          merge remains pending. Never edit code, push, publish, merge, approve a
          recovery gate, or mutate routing from this return prompt.
  on_noop:
    - *return_to_origin
  on_blocked:
    - *return_to_origin
  on_failed:
    - *return_to_origin
  on_exhausted:
    - *return_to_origin
  on_stalled:
    - *return_to_origin
  on_canceled:
    - *return_to_origin

start:
  - kind: manual
  - kind: cli
  - kind: http
  - kind: uds
  - kind: native_tool
  - kind: schedule

graph:
  nodes:
    - id: slug_input
      class: source
      kind: input
      input_ref: slug

    - id: load_check
      class: action
      kind: ext__spec_cycle__import_tasks
      params:
        pattern: ".compozy/tasks/{{ .inputs.slug }}/task_*.md"
      produces:
        tasks: array
        count: integer

    - id: implement
      class: action
      kind: run-loop
      params:
        loop: implement-tasks
        inputs:
          slug: "{{ .inputs.slug }}"
          auto_commit: true

    - id: review
      class: action
      kind: run-loop
      params:
        loop: review-and-fix
        inputs:
          task_name: "{{ .inputs.slug }}"
          auto_commit: true

    - id: publication_plan
      class: action
      kind: ext__batuta__publication_plan
      params:
        worktree_ref: "{{ .inputs.worktree_ref }}"

    - id: publication_route
      class: control
      kind: route
      routes:
        - when: nodes.publication_plan.output.disposition == 'publishable'
          to: publish
        - when: nodes.publication_plan.output.disposition == 'nothing_to_publish'
          to: publication_verify_nothing
        - when: nodes.publication_plan.output.disposition == 'blocked'
          to: recovery_gate
      default: publication_contract_failure

    - id: publish
      class: action
      kind: goal
      params:
        agent: batuta-publisher
        environment:
          mode: worktree
          worktree_ref: "{{ .inputs.worktree_ref }}"
        judge: &publisher_judge
          - id: reviewed_worktree_remains_clean
            type: command
            check: "test -z \"$(git -C . status --porcelain)\""
        max_turns: 4
        output_schema: &publisher_output
          type: object
          additionalProperties: false
          required: [status, publication_result]
          properties:
            status:
              enum: [complete, blocked]
            publication_result:
              type: object
              additionalProperties: false
              required: [status, head_sha, op_ids, summary, last_exit_plan]
              properties:
                status:
                  enum: [published, nothing_to_publish, blocked]
                head_sha:
                  type: string
                op_ids:
                  type: array
                  items:
                    type: string
                pr_url:
                  type: string
                summary:
                  type: string
                last_exit_plan:
                  type: object
        objective: |
          Call ext__batuta__publish_worktree exactly once with worktree_ref
          {{ .inputs.worktree_ref }} and expected_head_sha
          {{ .nodes.publication_plan.output.head_sha }}. Copy its structured
          result byte-for-byte into publication_result. Report top-level status
          complete only for published or nothing_to_publish; report blocked for
          blocked. Never call another tool, invent evidence, accept a compare
          URL, retry a mutation, or merge the pull request.

    - id: publication_verify
      class: action
      kind: ext__batuta__publication_verify
      params:
        worktree_ref: "{{ .inputs.worktree_ref }}"
        expected_head_sha: "{{ .nodes.publication_plan.output.head_sha }}"
        publisher_result: "{{ .nodes.publish.output.publication_result }}"

    - id: publication_verify_nothing
      class: action
      kind: ext__batuta__publication_verify
      params:
        worktree_ref: "{{ .inputs.worktree_ref }}"
        expected_head_sha: "{{ .nodes.publication_plan.output.head_sha }}"
        publisher_result:
          status: nothing_to_publish
          head_sha: "{{ .nodes.publication_plan.output.head_sha }}"
          op_ids: []
          summary: "fresh publication plan found no commits to publish"
          last_exit_plan: "{{ .nodes.publication_plan.output.exit_plan }}"

    - id: recovery_gate
      class: control
      kind: gate
      criteria:
        - kind: human
      effects:
        on_pause:
          - tool: compozy__session_prompt
            with:
              session_id: "{{ .inputs.origin_session_id }}"
              message_id: "batuta-recovery-{{ .effect.identity.loop_run_id }}-publication"
              idempotency_key: "batuta-recovery-{{ .effect.identity.loop_run_id }}-publication"
              mode: queue
              message: |
                Batuta delivery run {{ .effect.identity.loop_run_id }} stopped
                before publication mutation with blocker
                {{ .nodes.publication_plan.output.blockers }}. Resolve the
                external condition, then approve exactly one fresh re-plan, or
                reject to stop. Batuta will never publish directly from this
                gate and will not ask again if the re-plan remains blocked.

    - id: publication_replan
      class: action
      kind: ext__batuta__publication_plan
      params:
        worktree_ref: "{{ .inputs.worktree_ref }}"

    - id: publication_replan_route
      class: control
      kind: route
      routes:
        - when: nodes.publication_replan.output.disposition == 'publishable'
          to: publish_after_recovery
        - when: nodes.publication_replan.output.disposition == 'nothing_to_publish'
          to: publication_verify_nothing_after_recovery
        - when: nodes.publication_replan.output.disposition == 'blocked'
          to: publication_blocked_stop
      default: recovery_contract_failure

    - id: publish_after_recovery
      class: action
      kind: goal
      params:
        agent: batuta-publisher
        environment:
          mode: worktree
          worktree_ref: "{{ .inputs.worktree_ref }}"
        judge: *publisher_judge
        max_turns: 4
        output_schema: *publisher_output
        objective: |
          After the one approved recovery re-plan, call
          ext__batuta__publish_worktree exactly once with worktree_ref
          {{ .inputs.worktree_ref }} and expected_head_sha
          {{ .nodes.publication_replan.output.head_sha }}. Copy its structured
          result byte-for-byte into publication_result. Report top-level status
          complete only for published or nothing_to_publish; report blocked for
          blocked. Never call another tool, invent evidence, accept a compare
          URL, retry a mutation, or merge the pull request.

    - id: publication_verify_after_recovery
      class: action
      kind: ext__batuta__publication_verify
      params:
        worktree_ref: "{{ .inputs.worktree_ref }}"
        expected_head_sha: "{{ .nodes.publication_replan.output.head_sha }}"
        publisher_result: "{{ .nodes.publish_after_recovery.output.publication_result }}"

    - id: publication_verify_nothing_after_recovery
      class: action
      kind: ext__batuta__publication_verify
      params:
        worktree_ref: "{{ .inputs.worktree_ref }}"
        expected_head_sha: "{{ .nodes.publication_replan.output.head_sha }}"
        publisher_result:
          status: nothing_to_publish
          head_sha: "{{ .nodes.publication_replan.output.head_sha }}"
          op_ids: []
          summary: "approved recovery re-plan found no commits to publish"
          last_exit_plan: "{{ .nodes.publication_replan.output.exit_plan }}"

    # Both stop nodes deliberately invoke the independent verifier with a
    # blocked result. The verifier rejects it, producing a terminal failure
    # without mutation, another gate, or a model turn.
    - id: publication_blocked_stop
      class: action
      kind: ext__batuta__publication_verify
      params: &blocked_stop
        worktree_ref: "{{ .inputs.worktree_ref }}"
        expected_head_sha: "{{ .nodes.publication_replan.output.head_sha }}"
        publisher_result:
          status: blocked
          head_sha: "{{ .nodes.publication_replan.output.head_sha }}"
          op_ids: []
          summary: "publication remains blocked after the one recovery re-plan"
          last_exit_plan: "{{ .nodes.publication_replan.output.exit_plan }}"

    - id: publication_contract_failure
      class: action
      kind: ext__batuta__publication_verify
      params:
        worktree_ref: "{{ .inputs.worktree_ref }}"
        expected_head_sha: "{{ .nodes.publication_plan.output.head_sha }}"
        publisher_result:
          status: blocked
          head_sha: "{{ .nodes.publication_plan.output.head_sha }}"
          op_ids: []
          summary: "publication plan returned an unsupported disposition"
          last_exit_plan: "{{ .nodes.publication_plan.output.exit_plan }}"

    - id: recovery_contract_failure
      class: action
      kind: ext__batuta__publication_verify
      params: *blocked_stop

  edges:
    - from: slug_input
      to: load_check
    - from: load_check
      to: implement
    - from: implement
      to: review
    - from: review
      to: publication_plan
    - from: publication_plan
      to: publication_route
    - from: publication_route
      to: publish
    - from: publication_route
      to: publication_verify_nothing
    - from: publication_route
      to: recovery_gate
    - from: publication_route
      to: publication_contract_failure
    - from: publish
      to: publication_verify
    - from: recovery_gate
      to: publication_replan
    - from: publication_replan
      to: publication_replan_route
    - from: publication_replan_route
      to: publish_after_recovery
    - from: publication_replan_route
      to: publication_verify_nothing_after_recovery
    - from: publication_replan_route
      to: publication_blocked_stop
    - from: publication_replan_route
      to: recovery_contract_failure
    - from: publish_after_recovery
      to: publication_verify_after_recovery
