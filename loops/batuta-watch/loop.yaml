apiVersion: compozy.loop/v1
kind: Loop
meta:
  name: batuta-watch
  description: Wake batuta when a batuta-deliver run reaches a terminal state, so it reports and decides next steps without operator polling.
  catalog:
    use_when: "Keep this running so batuta reacts to batuta-deliver terminals (report, escalate, or close) without the operator polling."
    keywords: [batuta, watch, wake, terminal]
    category: Engineering

concurrency: forbid

inputs:
  conductor:
    type: agent
    default: batuta

contract:
  goal: >
    Whenever a batuta-deliver run reaches a terminal state, have the conductor read the run,
    report the exact outcome, and decide the follow-up.
  definition_of_done: >
    Each observed terminal produced one conductor report turn.
  iteration_cap: 0
  budget:
    tokens: 0
    wall_clock_sec: 0
    on_exceeded: halt
  terminal_states: [done, no-op, blocked, failed, exhausted, stalled]

start:
  - kind: manual
  - kind: cli
  - kind: http
  - kind: uds
  - kind: native_tool

graph:
  nodes:
    - id: deliver_terminal
      class: source
      kind: watch-events
      events:
        - kind: loop.terminal
          filter: "event.loop_name == 'batuta-deliver'"

    - id: conduct
      class: action
      kind: run-agent
      session:
        isolated: true
      timeout: 15m
      params:
        agent: "{{ .inputs.conductor }}"
        output_schema:
          type: object
          required: [status, summary]
          properties:
            status:
              enum: [reported]
            summary:
              type: string
            follow_up:
              type: string
        prompt: |
          A batuta-deliver run reached a terminal state. Event payload:
          {{ .nodes.deliver_terminal.output }}

          You are the conductor in wake mode — no operator is present in this
          isolated session. Do now:
          1. Read the run with the loop status surface (run ID is in the event
             payload) and identify the exact terminal outcome and, on failure,
             which child (implement or review) stopped and why.
          2. Write a concise operator-facing report of the exact outcome into
             your structured `summary` (the operator reads it in the run
             history): terminal state, run IDs, commits produced, and — on
             anything other than done — the precise blocker.
          3. On a failed/exhausted/stalled deliver caused by a routing lane,
             you may prepare (but not apply) an escalation suggestion in
             `follow_up`. Never re-dispatch, never approve gates, never edit
             code from this wake session.
          Return status "reported".

  edges:
    - from: deliver_terminal
      to: conduct
