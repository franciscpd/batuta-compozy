[extension]
name = "batuta"
version = "0.1.0"
description = "Batuta, the conductor: routes CompozyOS dev-cycle work to the cheapest capable executor and never writes code itself."
# min_compozy_version set to 0.2.0 (not 0.3.0) because:
# Current daemon is 0.3.0-beta.13. In semver, prerelease versions are lower than the final release
# (0.3.0-beta.13 < 0.3.0), so it would fail validation with min=0.3.0. Temporary floor until 0.3.0 ships.
min_compozy_version = "0.2.0"

[resources]
agents = ["agents"]
skills = ["resources/skills"]
loops = ["loops"]
