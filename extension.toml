[extension]
name = "batuta"
version = "0.1.0-beta.5"
description = "Batuta, the conductor: routes CompozyOS spec-cycle work to the cheapest capable executor and never writes code itself."
# Batuta Next requires typed resources and conjunctive runtime rules.
min_compozy_version = "0.3.0-beta.21"

[[resources.agents]]
path = "agents"

[[resources.skills]]
path = "resources/skills"

[[resources.loops]]
path = "loops"
